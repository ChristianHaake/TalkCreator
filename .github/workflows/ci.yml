name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.22.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.22.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run verification gate
      run: npm run verify
